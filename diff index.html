  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

    body {
      background: radial-gradient(circle at top, #1aff8c, #0b0033 70%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px;
      transition: background 1s ease;
    }

    .profile-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #00ff99;
      box-shadow: 0 0 25px rgba(0, 255, 153, 0.4);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .profile-img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(0, 255, 153, 0.6);
    }

    h1 {
      font-size: 2rem;
      margin: 10px 0;
      letter-spacing: 1px;
    }

    p {
      color: #bfbfbf;
      font-size: 0.95rem;
      margin-bottom: 25px;
      text-align: center;
      max-width: 320px;
    }

    .links {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 500;
      padding: 14px 0;
      border-radius: 10px;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .link svg {
      width: 22px;
      height: 22px;
    }

    /* Colores personalizados */
    .instagram {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
    }

    .tiktok {
      background: #000;
      color: white;
      border: 1px solid #555;
    }

    .youtube {
      background: #ff0000;
      color: white;
    }

    .spotify {
      background: #1db954;
      color: white;
    }

    .link:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
    }

    footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #777;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.6rem; }
      p { font-size: 0.9rem; }
      .link { font-size: 0.95rem; }
    }
  </style>
