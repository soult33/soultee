<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soultee | Enlaces Oficiales</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(rgba(3, 7, 18, 0.75), rgba(3, 7, 18, 0.85)), url('fondo.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 50px 20px;
    }

    .profile-container {
      position: relative;
      margin-bottom: 20px;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover; /* Esto fuerza a que la foto llene el círculo recortando los bordes sobrantes de forma proporcional */
      object-position: center; /* Centra la imagen perfectamente */
      border: 2px solid rgba(0, 255, 153, 0.6);
      box-shadow: 0 0 30px rgba(0, 255, 153, 0.25);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .profile-img:hover {
      transform: scale(1.08);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 5px 0 8px 0;
      letter-spacing: -0.5px;
    }

    p {
      color: #9ca3af;
      font-size: 0.9rem;
      font-weight: 400;
      margin-bottom: 35px;
      text-align: center;
      max-width: 320px;
      line-height: 1.4;
    }

    .links {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      font-weight: 600;
      padding: 16px 20px;
      border-radius: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .link svg {
      width: 20px;
      height: 20px;
      opacity: 0.9;
      flex-shrink: 0;
    }

    /* Estilos específicos profesionales para cada marca al pasar el mouse */
    .link.instagram:hover {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      border-color: transparent;
      box-shadow: 0 6px 25px rgba(220, 39, 67, 0.4);
    }

    .link.tiktok:hover {
      background: #111;
      border-color: #777;
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.15);
    }

    .link.youtube:hover {
      background: #ff0000;
      border-color: transparent;
      box-shadow: 0 6px 25px rgba(255, 0, 0, 0.4);
    }

    .link.spotify:hover {
      background: #1db954;
      border-color: transparent;
      box-shadow: 0 6px 25px rgba(29, 185, 84, 0.4);
    }

    .link:hover {
      transform: translateY(-3px);
    }

    footer {
      margin-top: 50px;
      font-size: 0.75rem;
      color: #6b7280;
      letter-spacing: 0.5px;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      .link { padding: 14px 18px; font-size: 0.9rem; }
    }
  </style>
